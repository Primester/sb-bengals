<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Film Room · 11U Scouting</title><meta name="description" content="11U football film review, formation diagrams, coaching observations and defensive game planning."><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080e18'/%3E%3Ccircle cx='10' cy='16' r='5' fill='none' stroke='%23438dff' stroke-width='2'/%3E%3Cpath d='m21 11 8 10m0-10-8 10' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e18;color:white;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}noscript a{color:#8ebaff}</style></head><body><iframe id="filmroom" title="Film Room — 11U game review" src="https://eleven-u-film-room.vernon-compa-5167.chatgpt.site/" allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><noscript><a href="https://eleven-u-film-room.vernon-compa-5167.chatgpt.site/">Open Film Room directly</a></noscript><script>
const origin='https://eleven-u-film-room.vernon-compa-5167.chatgpt.site';
const frame=document.getElementById('filmroom');
const valid=hash=>/^#play-([1-9]\d*)$/.test(hash)&&Number(hash.slice(6))<=84;
if(valid(location.hash))frame.src=origin+'/'+location.hash;
addEventListener('message',event=>{if(event.origin!==origin||event.source!==frame.contentWindow||event.data?.type!=='film-room:play'||!Number.isInteger(event.data.play)||event.data.play<1||event.data.play>84)return;history.replaceState(null,'','#play-'+event.data.play)});
addEventListener('hashchange',()=>{if(valid(location.hash))frame.contentWindow.postMessage({type:'film-room:set-play',play:Number(location.hash.slice(6))},origin)});
</script></body></html>
